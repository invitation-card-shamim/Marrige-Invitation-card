<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Noto+Serif+Bengali:wght@600&display=swap" rel="stylesheet">
<style>
:root{--b1:#1a0b2e;--b2:#3d1560;--a:#ffd166;--t:#fff}
*{box-sizing:border-box;margin:0}
body{font:17px/1.7 'Hind Siliguri',sans-serif;color:var(--t);background:linear-gradient(160deg,var(--b1),var(--b2)) fixed;min-height:100vh;text-align:center;overflow-x:hidden;padding-bottom:200px}
h2,.big{font-family:'Noto Serif Bengali',serif;color:var(--a);font-size:1.6rem}
.st{display:none;max-width:560px;margin:14px auto;padding:20px 16px;border:2px solid var(--a);border-radius:20px;background:#0003;transition:.6s}
.st.v{display:block;animation:up 1s both}@keyframes up{from{opacity:0;transform:translateY(60px)}}
.st.d{padding:8px 14px;font-size:.85rem;opacity:.85}.st.d .stage{display:none}.st.d h2{font-size:1.05rem}.st.d .ph{width:56px;height:56px;margin:2px}.st.d .gal{display:none}.st.d .big{font-size:1.1rem!important}
.full .st.d{padding:20px 16px;font-size:inherit;opacity:1}.full .st.d h2{font-size:1.6rem}.full .st.d .gal{display:grid}.full .st.d .ph{width:200px;height:200px;margin:10px}.full .st.d .big{font-size:1.6rem!important}.full .st.d .stage{display:none}
.rgb .st{animation:h 5s linear infinite}
@keyframes h{0%,100%{border-color:#f0f;box-shadow:0 0 16px #f0f}33%{border-color:#0ff;box-shadow:0 0 16px #0ff}66%{border-color:#ff0;box-shadow:0 0 16px #ff0}}
.stage{position:relative;height:190px;border-radius:14px;overflow:hidden;margin-bottom:12px;display:flex;align-items:center;justify-content:center}
.ctr{font-size:90px;line-height:1;animation:fl 3s ease-in-out infinite;z-index:1}@keyframes fl{50%{transform:translateY(-10px) scale(1.06)}}
.pt{position:absolute;opacity:.9;animation:fall linear infinite}.rise .pt{animation-name:rs}
@keyframes fall{from{top:-24px}to{top:200px}}@keyframes rs{from{top:200px}to{top:-24px}}
.fan{transform-origin:0 0;animation:op 2.8s ease-out both}@keyframes op{from{transform:scale(.05) rotate(-40deg);opacity:0}}
.fl{animation:up 1.8s .3s both}
.mq{overflow:hidden;white-space:nowrap}.mq span{display:inline-block;animation:m 14s linear infinite}
@keyframes m{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.bl{animation:b 1.2s steps(2) infinite}@keyframes b{50%{opacity:.25}}
.nt{background:var(--a);color:#000;position:sticky;top:0;z-index:6}
.ph{width:200px;height:200px;object-fit:cover;border-radius:50%;border:3px solid var(--a);margin:10px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gal img{width:100%;border-radius:12px}
.bt{display:inline-block;margin:5px;padding:10px 20px;border:0;border-radius:30px;background:var(--a);color:#000;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
#cv{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:linear-gradient(160deg,var(--b1),var(--b2));transition:1s}
#cv input{padding:10px;border-radius:12px;border:0;font:inherit;width:240px;text-align:center}
#lb,#mt{position:fixed;top:8px;z-index:5;padding:6px 14px;border:0;border-radius:20px;background:var(--a);color:#000}#lb{right:8px}#mt{left:8px}
#nx{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:5;padding:13px 34px;font-size:18px;color:var(--b1);box-shadow:0 0 20px var(--a);white-space:nowrap}#sk{position:fixed;bottom:calc(58px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:5;padding:8px 16px;background:none;border:0;color:var(--t);opacity:.7;font-size:13px;white-space:nowrap}
.full ~ #nx,.full ~ #sk{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"></div><button id="nx" class="bt"></button><button id="sk"></button><div id="cv"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="/config.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const db=supabase.createClient(SB_URL,SB_KEY),P=location.pathname.split('/').filter(Boolean),Q=new URLSearchParams(location.search);
const TH=[['#1a0b2e','#3d1560','#ffd166','#fff'],['#05050f','#14002b','#00f0ff','#fff',1],['#fff0f5','#ffd6e0','#c2185b','#3b1a28'],['#04281f','#0b5d46','#e8c872','#fff'],['#fff8ec','#ffe0b2','#b71c1c','#3a1c0a'],['#fafafa','#e8e8ee','#222','#222'],['#fff59d','#ffb300','#2e7d32','#3a2a00'],['#020b24','#0b2a5b','#ffe082','#fff'],['#3b1f2b','#8d4f5e','#f4c2c2','#fff',1],['#000','#1c1c1c','#ff3d3d','#f5f5f5',1]];
const SC=[['ময়ূর','P','🪶','fall','#0b3d5c','#0a8a7a'],['কবুতর','🕊️','🪶','fall','#274c77','#a3cef1'],['পাখি','🐦','🍃','fall','#2d6a4f','#95d5b2'],['প্রজাপতি','🦋','✿','rise','#7b2cbf','#ffafcc'],['জোনাকি','✨','•','rise','#02111f','#0b3d2e'],['সূর্যোদয়','🌅','☁','fall','#ff7b00','#ffd166'],['নদী ও নৌকা','⛵','〰','rise','#0077b6','#90e0ef'],['তারাভরা রাত','🌌','★','fall','#03001e','#7303c0'],['ঝরা পাতা','🍂','🍁','fall','#7f4f24','#e9c46a'],['গোলাপ','🌹','🌹','fall','#590d22','#c9184a'],['শাপলা','🪷','🌸','rise','#1b4332','#ffb3c6'],['ফুলের বাগান','🌻','🌼','fall','#386641','#a7c957'],['মসজিদ','M','✧','rise','#012a4a','#2a6f97'],['আলপনা','❁','❀','rise','#8d0801','#b8860b'],['আতশবাজি','🎆','✺','rise','#000814','#3a0ca3'],['লণ্ঠন','🏮','•','rise','#3c096c','#ff6d00'],['বেলুন','🎈','🎈','rise','#00b4d8','#ffd6ff'],['হৃদয়','❤️','♥','rise','#6a040f','#ff758f']];
const PK=`<svg viewBox="-100 -100 200 130" width="240"><g class="fan">${[...Array(11)].map((_,i)=>`<g transform="rotate(${-75+i*15})"><ellipse cy="-70" rx="9" ry="30" fill="#0aa" stroke="#fd0"/><circle cy="-86" r="6" fill="#06c"/><circle cy="-86" r="2.5" fill="#fd0"/></g>`).join('')}</g><ellipse cy="12" rx="13" ry="20" fill="#05a"/><circle cy="-12" r="8" fill="#05a"/></svg>`;
const MQ=`<svg viewBox="0 0 200 120" width="230"><path d="M60 105Q100 15 140 105Z" fill="#e8c872"/><rect x="20" y="40" width="14" height="65" fill="#e8c872"/><rect x="166" y="40" width="14" height="65" fill="#e8c872"/><path d="M20 40L27 22L34 40ZM166 40L173 22L180 40Z" fill="#fff"/><rect x="10" y="105" width="180" height="8" fill="#fff"/><text x="94" y="30" font-size="26" fill="#ffe082">☾</text></svg>`;
let C,lang,k=0,au,si,N=Q.get('n');
(async()=>{
 const s=decodeURIComponent(P[0]||''),{data}=await db.from('cards').select('*').eq('slug',s).maybeSingle();
 if(!data){$('#cv').innerHTML='<p>কার্ড পাওয়া যায়নি / Card not found</p>';return}
 C=data;let th=+P[1]||C.live[0];if(!C.live.includes(th))th=C.live[0];
 lang=Q.get('l')||C.first_lang;db.from('views').insert({slug:s,theme:th}).then(()=>{});
 const sc=Q.get('s')||(C.data.scene&&C.data.scene!='auto'?C.data.scene:0);si=sc?Math.min(17,Math.max(0,+sc-1)):Math.floor(Math.random()*18);
 const t=TH[th-1],r=document.documentElement.style;['b1','b2','a','t'].forEach((x,i)=>r.setProperty('--'+x,t[i]));if(t[4])document.body.classList.add('rgb');
 render();cover();
})();
const stg=()=>{const s=SC[si];return `<div class="stage ${s[3]}" style="background:linear-gradient(160deg,${s[4]},${s[5]})"><div class="ctr">${s[1]=='P'?PK:s[1]=='M'?MQ:s[1]}</div>${Array.from({length:9},()=>`<span class="pt" style="left:${Math.random()*95}%;font-size:${12+Math.random()*14}px;animation-duration:${3+Math.random()*4}s;animation-delay:-${Math.random()*5}s">${s[2]}</span>`).join('')}</div>`};
function cover(){const b=lang=='bn';
 $('#cv').innerHTML=`<div class="big" style="font-size:3rem">﷽</div><h2 class="bl">💌</h2>`+(N?`<p>${b?'প্রিয় ':'Dear '}<b>${esc(N)}</b></p>`:`<input id="nm" placeholder="${b?'অতিথির নাম (ইচ্ছা হলে)':'Guest name (optional)'}"><button class="bt" id="wa">${b?'WhatsApp-এ পাঠান':'Send on WhatsApp'}</button>`)+`<button class="bt" id="op">${b?'কার্ড খুলুন':'Open card'}</button>`;
 $('#op').onclick=()=>{$('#cv').style.opacity=0;setTimeout(()=>$('#cv').remove(),1000);if(C.data.audio){au=new Audio(C.data.audio);au.loop=true;au.play().catch(()=>{})}};
 if($('#wa'))$('#wa').onclick=()=>{const n=$('#nm').value.trim(),u=location.origin+location.pathname+(n?'?n='+encodeURIComponent(n)+'&l='+lang:''),m=(n?(b?'প্রিয় '+n+', ':'Dear '+n+', '):'')+(b?'আপনাকে সাদর আমন্ত্রণ। কার্ড দেখুন: ':'You are warmly invited. See the card: ')+u;open('https://wa.me/?text='+encodeURIComponent(m))}}
function render(){
 const d=C.data[lang]||{},o=C.data[lang=='bn'?'en':'bn']||{},g=q=>esc(d[q]||o[q]||''),b=lang=='bn',x=(a,e)=>b?a:e,c=C.contacts||{},m=C.data;
 const ln=[['wa','💬 WhatsApp','https://wa.me/'+String(c.wa||'').replace(/\D/g,'')],['fb','Facebook',c.fb],['yt','YouTube',c.yt]].filter(([q])=>c[q]&&c[q+'_s']).map(([,l,u])=>`<a class="bt" href="${esc(u)}" target="_blank">${l}</a>`).join('');
 const side=(t,n,f,mo,a)=>g(n)?`<h2>${t}</h2><p>${g(n)}<br>${x('পিতা','Father')}: ${g(f)}<br>${x('মাতা','Mother')}: ${g(mo)}<br>${g(a)}</p>`:'';
 const L=[`<div class="big" style="font-size:2.4rem">﷽</div><h2 class="fl">${N?esc(N):x('সম্মানিত অতিথি','Honoured Guest')}</h2><p class="fl">${x('আপনাকে স্বাগতম','You are most welcome')}</p>`,
 g('msg')&&`<p>${g('msg')}</p>`,g('ev')&&`<h2 class="bl">${g('ev')}</h2>`,m.photo&&`<img class="ph" src="${esc(m.photo)}">`,
 side(x('বরের পরিচিতি','The Groom'),'gn','gf','gm','ga'),side(x('কনের পরিচিতি','The Bride'),'bn','bf','bm','ba'),
 (g('dt')||g('bd'))&&`<h2>${x('তারিখ','Date')}</h2><div class="mq"><span>${g('dt')} ❖ ${g('bd')}</span></div>`,g('dy')&&`<h2>${x('সময়','Time')}</h2><p>${g('dy')}</p>`,
 g('vn')&&`<h2>${x('স্থান','Venue')}</h2><p>${g('vn')}</p>${m.map?`<a class="bt" href="${esc(m.map)}" target="_blank">📍 ${x('ম্যাপ','Map')}</a>`:''}`,
 m.iso&&`<h2>${x('আর বাকি','Time left')}</h2><div id="cd" class="big bl"></div>`,(m.gal||[]).length&&`<div class="gal">${m.gal.map(u=>`<img src="${esc(u)}" loading="lazy">`).join('')}</div>`,
 `<p>${x('অভ্যর্থনায়','With welcome')}: ${g('wel')}</p><p>${x('প্রয়োজনে','Regrets only')}: ${g('ph')}</p><p>${x('শুভেচ্ছান্তে','With best wishes')}: ${g('wi')}</p>${ln}`].filter(Boolean);
 $('#app').innerHTML=(C.notice?`<div class="mq nt"><span>${esc(C.notice)}</span></div>`:'')+`<button id="lb">${x('English','বাংলা')}</button>${m.audio?'<button id="mt">♪</button>':''}`+L.map(h=>`<section class="st">${stg()}${h}</section>`).join('');
 $('#nx').textContent=x('পরের ধাপ ›','Next ›');$('#sk').textContent=x('সরাসরি পুরো কার্ড দেখুন','Skip to full card');
 $('#lb').onclick=()=>{lang=b?'en':'bn';render()};if($('#mt'))$('#mt').onclick=()=>au&&(au.paused?au.play():au.pause());
 $('#nx').onclick=()=>{k++;show()};$('#sk').onclick=()=>{k=99;show()};show(1);
 clearInterval(window.cdt);window.cdt=setInterval(()=>{const s=(new Date(m.iso)-Date.now())/1000;if(!$('#cd')||isNaN(s)||s<0)return;$('#cd').textContent=`${Math.floor(s/86400)} ${x('দিন','d')} ${Math.floor(s/3600%24)} ${x('ঘণ্টা','h')} ${Math.floor(s/60%60)} ${x('মিনিট','m')} ${Math.floor(s%60)} ${x('সেকেন্ড','s')}`},1000)}
function show(quiet){const S=[...document.querySelectorAll('.st')];if(k>=S.length){k=S.length;$('#app').classList.add('full');$('#nx').hidden=$('#sk').hidden=true}else $('#app').classList.remove('full');
 S.forEach((e,i)=>e.className='st'+(i<k?' v d':i==k?' v':''));if(!quiet&&S[k])S[k].scrollIntoView({behavior:'smooth',block:'center'})}
</script></body></html>
