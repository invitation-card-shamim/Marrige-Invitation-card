<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Noto+Serif+Bengali:wght@600&display=swap" rel="stylesheet">
<style>
:root{--b1:#1a0b2e;--b2:#3d1560;--a:#ffd166;--t:#fff}
*{box-sizing:border-box;margin:0}
body{font:17px/1.7 'Hind Siliguri',sans-serif;color:var(--t);background:linear-gradient(160deg,var(--b1),var(--b2)) fixed;min-height:100vh;text-align:center;overflow-x:hidden}
h2,.big{font-family:'Noto Serif Bengali',serif;color:var(--a);font-size:1.6rem}
.s{max-width:560px;margin:30px auto;padding:26px 18px;border:2px solid var(--a);border-radius:20px;background:#0003;opacity:0;transform:translateY(40px);transition:1s}
.s.on{opacity:1;transform:none}
.rgb .s{animation:h 5s linear infinite}
@keyframes h{0%,100%{border-color:#f0f;box-shadow:0 0 16px #f0f}33%{border-color:#0ff;box-shadow:0 0 16px #0ff}66%{border-color:#ff0;box-shadow:0 0 16px #ff0}}
.mq{overflow:hidden;white-space:nowrap}.mq span{display:inline-block;animation:m 14s linear infinite}
@keyframes m{from{transform:translateX(100%)}to{transform:translateX(-100%)}}
.bl{animation:b 1.2s steps(2) infinite}@keyframes b{50%{opacity:.25}}
.nt{background:var(--a);color:#000;position:sticky;top:0;z-index:6}
.ph{width:200px;height:200px;object-fit:cover;border-radius:50%;border:3px solid var(--a);margin:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:.95rem}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gal img{width:100%;border-radius:12px}
.bt{display:inline-block;margin:5px;padding:10px 20px;border:0;border-radius:30px;background:var(--a);color:#000;font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
#cv{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:linear-gradient(160deg,var(--b1),var(--b2));transition:1s}
#cv input{padding:10px;border-radius:12px;border:0;font:inherit;width:240px;text-align:center}
#lb,#mt{position:fixed;top:8px;z-index:5;padding:6px 14px;border:0;border-radius:20px;background:var(--a);color:#000}#lb{right:8px}#mt{left:8px}
.p{position:fixed;top:-30px;z-index:1;pointer-events:none;color:var(--a);animation:f linear forwards}
@keyframes f{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><div id="app"></div><div id="cv"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="/config.js"></script>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const db=supabase.createClient(SB_URL,SB_KEY),P=location.pathname.split('/').filter(Boolean),Q=new URLSearchParams(location.search);
const TH=[['#1a0b2e','#3d1560','#ffd166','#fff','✦'],['#05050f','#14002b','#00f0ff','#fff','•',1],['#fff0f5','#ffd6e0','#c2185b','#3b1a28','❀'],['#04281f','#0b5d46','#e8c872','#fff','✧'],['#fff8ec','#ffe0b2','#b71c1c','#3a1c0a','❁'],['#fafafa','#e8e8ee','#222','#222','·'],['#fff59d','#ffb300','#2e7d32','#3a2a00','✿'],['#020b24','#0b2a5b','#ffe082','#fff','★'],['#3b1f2b','#8d4f5e','#f4c2c2','#fff','♥',1],['#000','#1c1c1c','#ff3d3d','#f5f5f5','✺',1]];
let C,lang,N=Q.get('n'),au;
const io=new IntersectionObserver(e=>e.forEach(i=>i.isIntersecting&&i.target.classList.add('on')),{threshold:.15});
(async()=>{
 const s=decodeURIComponent(P[0]||''),{data}=await db.from('cards').select('*').eq('slug',s).maybeSingle();
 if(!data){$('#cv').innerHTML='<p>কার্ড পাওয়া যায়নি / Card not found</p>';return}
 C=data;let th=+P[1]||C.live[0];if(!C.live.includes(th))th=C.live[0];
 lang=Q.get('l')||C.first_lang;db.from('views').insert({slug:s,theme:th}).then(()=>{});
 const t=TH[th-1],r=document.documentElement.style;['b1','b2','a','t'].forEach((k,i)=>r.setProperty('--'+k,t[i]));
 if(t[5])document.body.classList.add('rgb');
 setInterval(()=>{const e=document.createElement('span');e.className='p';e.textContent=t[4];e.style.left=Math.random()*100+'vw';e.style.fontSize=10+Math.random()*16+'px';e.style.animationDuration=6+Math.random()*6+'s';document.body.append(e);setTimeout(()=>e.remove(),12000)},700);
 render();cover();
})();
function cover(){const b=lang=='bn';
 $('#cv').innerHTML=`<div class="big" style="font-size:3rem">﷽</div><h2 class="bl">💌</h2>`+(N?`<p>${b?'প্রিয় ':'Dear '}<b>${esc(N)}</b></p>`:`<input id="nm" placeholder="${b?'অতিথির নাম (ইচ্ছা হলে)':'Guest name (optional)'}"><button class="bt" id="wa">${b?'WhatsApp-এ পাঠান':'Send on WhatsApp'}</button>`)+`<button class="bt" id="op">${b?'কার্ড খুলুন':'Open card'}</button>`;
 $('#op').onclick=()=>{$('#cv').style.opacity=0;setTimeout(()=>$('#cv').remove(),1000);if(C.data.audio){au=new Audio(C.data.audio);au.loop=true;au.play().catch(()=>{})}};
 if($('#wa'))$('#wa').onclick=()=>{const n=$('#nm').value.trim(),u=location.origin+location.pathname+(n?'?n='+encodeURIComponent(n)+'&l='+lang:''),m=(n?(b?'প্রিয় '+n+', ':'Dear '+n+', '):'')+(b?'আপনাকে সাদর আমন্ত্রণ। কার্ড দেখুন: ':'You are warmly invited. See the card: ')+u;open('https://wa.me/?text='+encodeURIComponent(m))}}
function render(){
 const d=C.data[lang]||{},o=C.data[lang=='bn'?'en':'bn']||{},g=k=>esc(d[k]||o[k]||''),b=lang=='bn',x=(a,e)=>b?a:e,c=C.contacts||{},m=C.data;
 const ln=[['wa','💬 WhatsApp','https://wa.me/'+String(c.wa||'').replace(/\D/g,'')],['fb','Facebook',c.fb],['yt','YouTube',c.yt]].filter(([k])=>c[k]&&c[k+'_s']).map(([,l,u])=>`<a class="bt" href="${esc(u)}" target="_blank">${l}</a>`).join('');
 const side=(t,n,f,mo,a)=>`<div><b>${t}</b><br>${g(n)}<br>${x('পিতা','Father')}: ${g(f)}<br>${x('মাতা','Mother')}: ${g(mo)}<br>${g(a)}</div>`;
 $('#app').innerHTML=(C.notice?`<div class="mq nt"><span>${esc(C.notice)}</span></div>`:'')+`<button id="lb">${x('English','বাংলা')}</button>${m.audio?'<button id="mt">♪</button>':''}
<section class="s"><div class="big" style="font-size:2.6rem">﷽</div><p>${N?x('প্রিয় ','Dear ')+'<b>'+esc(N)+'</b>':x('সম্মানিত অতিথি','Honoured Guest')}</p><h2 class="bl">${g('ev')}</h2>${m.photo?`<img class="ph" src="${esc(m.photo)}">`:''}<div class="mq"><span>${g('dt')} ❖ ${g('bd')} ❖ ${g('dy')}</span></div></section>
<section class="s"><p>${g('msg')}</p></section>
<section class="s"><h2>${x('পরিচিতি','Introduction')}</h2><div class="two">${side(x('বর','Groom'),'gn','gf','gm','ga')}${side(x('কনে','Bride'),'bn','bf','bm','ba')}</div></section>
<section class="s"><h2>${x('অনুষ্ঠান সূচী','Programme')}</h2><p>${g('dt')}<br>${g('bd')}<br>${g('dy')}</p><p>${g('vn')}</p>${m.map?`<a class="bt" href="${esc(m.map)}" target="_blank">📍 ${x('ম্যাপ','Map')}</a>`:''}<div id="cd" class="big bl"></div></section>
${(m.gal||[]).length?`<section class="s"><div class="gal">${m.gal.map(u=>`<img src="${esc(u)}" loading="lazy">`).join('')}</div></section>`:''}
<section class="s"><p>${x('অভ্যর্থনায়','With welcome')}: ${g('wel')}</p><p>${x('প্রয়োজনে','Regrets only')}: ${g('ph')}</p><p>${x('শুভেচ্ছান্তে','With best wishes')}: ${g('wi')}</p>${ln}</section>`;
 document.querySelectorAll('.s').forEach(e=>io.observe(e));
 $('#lb').onclick=()=>{lang=b?'en':'bn';render()};
 if($('#mt'))$('#mt').onclick=()=>au&&(au.paused?au.play():au.pause());
 clearInterval(window.cdt);window.cdt=setInterval(()=>{const s=(new Date(m.iso)-Date.now())/1000;if(!m.iso||isNaN(s)||s<0)return;$('#cd').textContent=`${Math.floor(s/86400)} ${x('দিন','d')} ${Math.floor(s/3600%24)} ${x('ঘণ্টা','h')} ${Math.floor(s/60%60)} ${x('মিনিট','m')} ${Math.floor(s%60)} ${x('সেকেন্ড','s')}`},1000)}
</script></body></html>
